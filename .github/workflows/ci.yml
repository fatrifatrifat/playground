name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build pkg-config \
            gcc-14 g++-14 python3-pip

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: conan install . --output-folder=build --build=missing -s build_type=Debug

      - name: Configure
        run: |
          cmake --preset conan-debug \
            -DTRADING_ENABLE_ALPACA_SDK=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ./build/engine-cpp/tests/trading_tests
